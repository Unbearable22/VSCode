services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: margintools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: margintools
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margintools"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
